name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; node24
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"
      - name: Install verifier prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends jq
          jq --version
          test "$(bun --version)" = "1.3.9"
      - name: Install locked dependencies
        run: make install
      - name: Diagnose formatting of cleanup changes (temporary)
        run: |
          bun run fmt
          git diff -- README.md docs/history.md interop/task-client.ts
      - name: Run deterministic regression checks
        run: >-
          make check LINT_FLAGS='--format github'
          TEST_FLAGS='--coverage --coverage-reporter=text --coverage-reporter=lcov --coverage-dir=coverage --reporter=junit --reporter-outfile=.test-results/junit.xml'
      - name: Verify installed npm tarball without provider credentials
        run: make package-smoke
      - name: Verify pinned real MCP bridge without provider credentials
        timeout-minutes: 3
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/a2a-interop-tools"
          mkdir -p "$tools" .test-results
          curl --fail --location --connect-timeout 10 --max-time 60 \
            --output "$tools/bridge.tar.gz" \
            https://github.com/vbcherepanov/a2abridge/releases/download/v4.0.2/a2abridge_4.0.2_linux_amd64.tar.gz
          printf '%s  %s\n' \
            b74f01378c880486a41acd5780364e238d59a1a1aec418c322d1c5bd7f40772a \
            "$tools/bridge.tar.gz" | sha256sum --check
          tar -xzf "$tools/bridge.tar.gz" -C "$tools" a2abridge
          printf '%s  %s\n' \
            bdfa1f6894f5547dfef539140139e162402ca6ab33bb7602d9335d125d414db2 \
            "$tools/a2abridge" | sha256sum --check
          mkdir -p "$tools/home" "$tools/tmp"
          env -i PATH="$(dirname "$(command -v bun)"):/usr/bin:/bin" \
            HOME="$tools/home" TMPDIR="$tools/tmp" \
            A2ABRIDGE_BIN="$tools/a2abridge" \
            A2A_INTEROP_REPORT="$PWD/.test-results/interop.json" \
            make interop-test
          test -s .test-results/interop.json
          jq -e '.evidenceClass == "provider-free-controlled-ACP" and .failed == false and .cleanup == true' \
            .test-results/interop.json
      - name: Summarize quality measurements
        if: always()
        run: bun scripts/quality-report.ts
      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-baseline
          path: |
            .test-results/
            coverage/
          include-hidden-files: true
          if-no-files-found: warn
