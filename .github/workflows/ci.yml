name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; node24
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"
      - name: Install verifier prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends jq
          jq --version
          test "$(bun --version)" = "1.3.9"
      - name: Install locked dependencies
        run: make install
      - name: Run deterministic regression checks
        run: >-
          make check LINT_FLAGS='--format github'
          TEST_FLAGS='--coverage --coverage-reporter=text --coverage-reporter=lcov --coverage-dir=coverage --reporter=junit --reporter-outfile=.test-results/junit.xml'
      - name: Summarize quality measurements
        if: always()
        run: bun scripts/quality-report.ts
      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-baseline
          path: |
            .test-results/
            coverage/
          include-hidden-files: true
          if-no-files-found: warn
